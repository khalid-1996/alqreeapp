name: alqaree
description: "القارئ — تلاوات وإذاعات القرآن الكريم، حديث ودعاء اليوم، والأذكار."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  hijri: ^3.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo_white.png
    - assets/icon/icon.png
    - assets/data/wamdat.json
    - assets/data/adhkar.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000A3A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true
