publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  hijri: ^3.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
