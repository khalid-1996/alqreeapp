name: Voice test

# Experiment: one ومضة video with an Arabic voice-over (Microsoft neural voices via edge-tts).
# Run it from Actions > Voice test > Run workflow; the result is attached to the run as an artifact.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Day (YYYY-MM-DD), a hadith or dua day'
        required: true
        default: '2026-10-28'
      voice:
        description: 'edge-tts voice'
        required: true
        default: 'ar-AE-HamdanNeural'
  push:
    branches: [main]
    paths: ['.github/workflows/voice-test.yml']

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAY: ${{ inputs.date || '2026-10-28' }}
      VOICE: ${{ inputs.voice || 'ar-AE-HamdanNeural' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null
          pip install -q playwright==1.47.0 edge-tts
          python -m playwright install --with-deps chromium >/dev/null
      - name: Script for the narration
        run: |
          python - <<'PY'
          import json, os, sys, datetime as dt
          sys.path.insert(0, 'server/video'); import render
          c = json.load(open('assets/data/wamdat.json'))
          kind, item = render.wamda_for(c, dt.date.fromisoformat(os.environ['DAY']))
          text = item['text'].replace('«', '').replace('»', '').replace('﴿', '').replace('﴾', '')
          src = item['source']
          if src.startswith('صحيح البخاري'):
              src = 'رواه البخاري'
          open('narration.txt', 'w').write(f'ومضة اليوم.\n{text}\n{src}.')
          print(kind, item['source']); print(open('narration.txt').read())
          PY
      - name: Voice samples (same opening line, several Gulf voices)
        run: |
          mkdir -p out
          for v in ar-AE-HamdanNeural ar-SA-HamedNeural ar-KW-FahedNeural ar-QA-MoazNeural ar-BH-AliNeural ar-OM-AbdullahNeural; do
            edge-tts --voice "$v" --rate=-8% --pitch=-4Hz --text "ومضة اليوم من تطبيق القارئ. إِنَّ مِنْ خِيَارِكُمْ أَحْسَنَكُمْ أَخْلَاقًا." --write-media "out/sample-$v.mp3"
          done
      - name: Narration
        run: |
          # Calm radio delivery: a little slower and deeper than default.
          edge-tts --voice "$VOICE" --rate=-8% --pitch=-4Hz --file narration.txt --write-media voice.mp3
          # Warm it up a touch and even out the level, like a studio voice.
          ffmpeg -v error -y -i voice.mp3 -af "highpass=f=70,equalizer=f=180:t=q:w=1:g=3,acompressor=threshold=-18dB:ratio=3:attack=10:release=200,loudnorm=I=-14:TP=-1.5:LRA=7,adelay=600|600,apad=pad_dur=1.2" -ar 48000 voice.m4a
          echo "SECONDS=$(ffprobe -v error -show_entries format=duration -of csv=p=0 voice.m4a)" >> "$GITHUB_ENV"
      - name: Video at the length of the voice
        run: |
          d=$(python -c "import os; print(max(8.0, round(float(os.environ['SECONDS']) + 0.3, 1)))")
          python server/video/render.py --date "$DAY" --out silent.mp4 --duration "$d"
          ffmpeg -v error -y -i silent.mp4 -i voice.m4a -c:v copy -c:a aac -b:a 160k -shortest -movflags +faststart "out/wamda-$DAY-voice-$VOICE.mp4"
          ls -la out
      - name: Publish to the voice-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view voice-test >/dev/null 2>&1 || gh release create voice-test --title "Voice test" --notes "Voice-over experiments." --latest=false --prerelease
          gh release upload voice-test out/* --clobber
