name: Ayah recitation test

# Experiment: Quran ومضة videos with a real reciter (Quran.com audio, cut to the shown words).
on:
  workflow_dispatch:
    inputs:
      reciter:
        description: 'Quran.com recitation id (7 = Mishari Alafasy)'
        required: true
        default: '7'
  push:
    branches: [main]
    paths: ['.github/workflows/ayah-voice-test.yml', 'server/video/ayah_audio.py']

permissions:
  contents: write

jobs:
  ayah:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RECITER: ${{ inputs.reciter || '7' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null
          pip install -q playwright==1.47.0
          python -m playwright install --with-deps chromium >/dev/null
      - name: Reciters available
        run: |
          python server/video/ayah_audio.py --list-reciters | tee reciters.txt
          echo "::notice title=reciters::$(tr '\n' ';' < reciters.txt | head -c 1500)"
      - name: Render samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, 'server/video'); import render
          c = json.load(open('assets/data/wamdat.json'))
          want = ['سورة البقرة · 153', 'سورة الرعد · 28', 'سورة الشرح · 5–6']
          items = [x for k in ('ayah', 'dua') for x in c[k] if x['source'] in want]
          rec = os.environ['RECITER']
          for n, item in enumerate(items):
              audio = f'a{n}.m4a'
              subprocess.run([sys.executable, 'server/video/ayah_audio.py', '--source', item['source'],
                              '--text', item['text'], '--reciter', rec, '--out', audio], check=True)
              sec = float(subprocess.check_output(['ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                                                   '-of', 'csv=p=0', audio]).decode())
              render.render('ayah', item, f'v{n}.mp4', max(8.0, round(sec + 0.3, 1)))
              name = item['source'].replace('سورة ', '').replace(' · ', '-').replace('–', '_').replace(' ', '_')
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', f'v{n}.mp4', '-i', audio, '-c:v', 'copy',
                              '-c:a', 'aac', '-b:a', '160k', '-shortest', '-movflags', '+faststart',
                              f'out/ayah-{name}-reciter{rec}.mp4'], check=True)
              print('::notice title=rendered::' + item['source'] + f' {sec:.1f}s')
          PY
          ls -la out
      - name: Publish to the voice-test release
        run: |
          gh release view voice-test >/dev/null 2>&1 || gh release create voice-test --title "Voice test" --notes "Voice-over experiments." --latest=false --prerelease
          gh release upload voice-test out/* reciters.txt --clobber
