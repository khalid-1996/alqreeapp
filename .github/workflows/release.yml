name: Build & Release

# Every push to main builds an APK and an (unsigned) IPA.
# The first build of each new `version:` in pubspec.yaml is published as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  ORG: net.alqareeapp
  PROJECT: alqaree

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create --org "$ORG" --project-name "$PROJECT" --platforms android,ios .

      - name: Analyze
        run: |
          python3 tool/patch_platforms.py android
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          flutter test 2>&1 | tee -a analyze.log

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Rename APK
        run: |
          NAME="alqaree-${GITHUB_REF_NAME//\//-}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '';
            const log = (read('analyze.log') + '\n' + read('build.log')).split('\n').filter(l => /error|Error|FAILURE|failed/.test(l)).slice(-80).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Android build failed (${context.sha.slice(0, 7)})`,
              body: '```\n' + (log || 'See the workflow run log.') + '\n```\n' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create --org "$ORG" --project-name "$PROJECT" --platforms android,ios .

      - name: Configure Info.plist
        run: |
          python3 tool/patch_platforms.py ios
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName القارئ" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          # alqaree:// links from the home-screen widgets
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string net.alqareeapp.alqaree" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string alqaree" "$PLIST"
          # iPhone only for the first release.
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: App icon and home-screen widget
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//')
          ruby ios_widget/add_widget.rb "${VERSION%%+*}" "${VERSION##*+}"

      - name: Build iOS (no code signing)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Package IPA
        run: |
          NAME="alqaree-${GITHUB_REF_NAME//\//-}-unsigned.ipa"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$NAME" Payload
          echo "IPA=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ env.IPA }}

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : '';
            const lines = log.split('\n').filter(l => /error|Error|failed/.test(l)).slice(-80).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `iOS build failed (${context.sha.slice(0, 7)})`,
              body: '```\n' + (lines || 'See the workflow run log.') + '\n```\n' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  release:
    # Publishes a Release named after the version in pubspec.yaml (e.g. v1.0.0),
    # once per version: bump `version:` to publish a new one.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "EXISTS=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v4
        if: env.EXISTS == 'false'
        with:
          path: dist
          merge-multiple: true

      - name: Name files by version
        if: env.EXISTS == 'false'
        run: |
          cd dist
          for f in *.apk; do mv "$f" "alqaree-$TAG.apk"; done
          for f in *.ipa; do mv "$f" "alqaree-$TAG-unsigned.ipa"; done
          ls -la

      - uses: softprops/action-gh-release@v2
        if: env.EXISTS == 'false'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: القارئ ${{ env.TAG }}
          files: dist/*
          body: |
            **القارئ ${{ env.TAG }}**

            - `alqaree-${{ env.TAG }}.apk`: للأندرويد، يتثبت مباشرة (موقّع بمفتاح تجريبي، مو لمتجر Google Play).
            - `alqaree-${{ env.TAG }}-unsigned.ipa`: للآيفون بدون توقيع، يحتاج توقيع قبل التثبيت (AltStore أو Sideloadly أو شهادة حسابك في أبل).
