name: Video service

# Builds the TikTok video image and renders one ومضة inside it, so a broken image never reaches the server.
on:
  push:
    branches: [main]
    paths: ['server/video/**', 'assets/icon/logo_white.png', '.github/workflows/video.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        timeout-minutes: 15
        run: docker build -f server/video/Dockerfile -t alqaree-video .
      - name: Render a sample inside the image
        shell: bash
        run: |
          set -euo pipefail
          docker images
          docker run -d --name video -e RENDER_AT=05:00 -p 8090:8090 alqaree-video 2>err.txt \
            || { echo "::error title=docker run::$(tr '\n' ' ' < err.txt)"; exit 1; }
          for i in $(seq 1 60); do curl -sf localhost:8090/health && break; sleep 2; done
          curl -sf --max-time 600 localhost:8090/day/2026-10-14 | tee day.json
          curl -sf -o wamda.mp4 localhost:8090/files/2026-10-14/wamda.mp4
          size=$(stat -c %s wamda.mp4)
          echo "::notice title=sample video::$(head -c 300 day.json) — $size bytes"
          test "$size" -gt 100000
      - name: Logs
        if: always()
        run: |
          docker logs video > logs.txt 2>&1 || true
          echo "::notice title=container log::$(tail -c 900 logs.txt | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-video
          path: wamda.mp4
